name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config --global user.email "bulat@aictrl.dev"
          git config --global user.name "Aictrl CI"

      - name: Build
        run: bun turbo build
        env:
          AICTRL_BUILD_SINGLE: "true"

      - name: Typecheck
        run: bun run typecheck

      - name: Install ripgrep test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
          rg --version

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Setup may download pinned wheels/ranks. Capture and accounting are offline.
      - name: Provision reference tokenizer
        run: python3 -I -B script/token-budget/setup.py --directory "$RUNNER_TEMP/token-budget-environment"

      - name: Enforce actual SDK prefix token budgets
        run: '"$RUNNER_TEMP/token-budget-environment/venv/bin/python3" -I -B script/token-budget/run.py --output "$RUNNER_TEMP/token-budget-evidence"'

      - name: Verify token-budget fault controls
        run: '"$RUNNER_TEMP/token-budget-environment/venv/bin/python3" -I -B -m unittest discover -s script/token-budget -p "test_*.py" -v'
        env:
          TOKEN_BUDGET_TEST_CAMPAIGN: ${{ runner.temp }}/token-budget-evidence

      - name: Retain token-budget captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: token-budget-evidence
          path: ${{ runner.temp }}/token-budget-evidence
          if-no-files-found: warn

      - name: Run Tests
        run: bun turbo test --concurrency=100%
