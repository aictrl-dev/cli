name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config --global user.email "bulat@aictrl.dev"
          git config --global user.name "Aictrl CI"

      - name: Build
        run: bun turbo build
        env:
          AICTRL_BUILD_SINGLE: "true"

      - name: Typecheck
        run: bun run typecheck

      - name: Install ripgrep test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
          rg --version

      - name: Run Tests
        run: bun turbo test --concurrency=100%
